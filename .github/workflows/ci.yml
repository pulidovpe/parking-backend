name: Parking Backend CI/CD AWS

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'test/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  id-token: write # REQUERIDO para pedir credenciales a AWS via OIDC
  contents: read  # REQUERIDO para leer el código

jobs:
  # --- JOB 1: TEST (Sin cambios) ---
  test:
    name: Run Tests & Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: parking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Push Database Schema
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/parking_test?schema=public"
      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: "test"
          PORT: "3000"
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/parking_test?schema=public"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          JWT_SECRET: "super_secret_test_key_123456789"
          JWT_REFRESH_SECRET: "super_refresh_test_key_987654321"
          JWT_EXPIRES_IN: "15m"
          ENCRYPTION_KEY: "12345678901234567890123456789012"
          SMTP_HOST: "smtp.ethereal.email"
          SMTP_PORT: "587"
          SMTP_USER: "dummy_user"
          SMTP_PASS: "dummy_pass"
          SMTP_FROM: "noreply@parkingapp.com"

  # --- JOB 2: BUILD & PUSH TO AWS ECR ---
  build-and-push:
    name: Build & Push to AWS ECR
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Lógica para crear el repositorio si no existe
      - name: Create ECR Repo if not exists
        env:
          ECR_REPO_NAME: parking-backend
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO_NAME || aws ecr create-repository --repository-name $ECR_REPO_NAME

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Usamos la salida del paso 'login-ecr' para obtener la URL correcta del registro
          tags: ${{ steps.login-ecr.outputs.registry }}/parking-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max